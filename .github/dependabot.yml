version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(python)"
    groups:
      runtime:
        dependency-type: production
        update-types: ["minor", "patch"]
      dev:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Pydantic majors need manual migration — handle out-of-band.
      - dependency-name: pydantic
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(node)"
    groups:
      runtime:
        dependency-type: production
        update-types: ["minor", "patch"]
      dev:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # The Node SDK ships zero runtime deps, so every npm entry here is dev
      # tooling. Tooling majors (eslint 10, typescript 6, @types/node 25) need
      # a manual migration and otherwise rot as red single-package PRs, so they
      # are held back the same way pydantic is above. Security alerts still
      # surface for these — only the automatic PR is suppressed.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(go)"
    groups:
      deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

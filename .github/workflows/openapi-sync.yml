name: openapi-sync

on:
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch + filter spec
        run: |
          ./scripts/fetch_openapi.sh
          python scripts/filter_openapi.py
      - name: Regenerate models
        run: |
          pip install -e "python[dev]"
          ./scripts/gen_models.sh
      - name: Run tests
        working-directory: python
        run: pytest -q
      # ponytail: must run before the PR step below — create-pull-request
      # commits any working-tree diff to a branch and resets the checkout
      # back to a clean `main`, so a `git diff` placed *after* it always
      # sees nothing, drifted or not (confirmed from this repo's own run
      # logs). This is the only point where the check is meaningful.
      - name: Fail if the OpenAPI spec/models drifted from the committed version
        run: git diff --exit-code
      - name: Open PR if spec changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: sync OpenAPI spec from prod"
          title: "chore: sync OpenAPI spec from prod"
          body: |
            Automated daily sync from https://legalize.dev/openapi.json.

            The filter + model-gen pipeline has run and tests pass. Review the
            diff for any unexpected schema changes.
          branch: auto/openapi-sync
          delete-branch: true

name: openapi-sync

# Detects drift between production's OpenAPI spec and the copy committed here.
# It does NOT open a pull request. It used to try, and failed on 18 consecutive
# scheduled runs with "GitHub Actions is not permitted to create or approve pull
# requests" — that toggle lives on the `legalize-dev` org, not on this repo, and
# turning it on would grant Actions PR-creation across all 40+ org repos,
# every country corpus included, to automate one file in this one.
#
# So the job's contract is now: go red when the spec has moved, and let
# failure-alert pick it up. Reconciling is two commands on a laptop:
#
#   ./scripts/fetch_openapi.sh && python scripts/filter_openapi.py
#   pip install -e "python[dev]" && ./scripts/gen_models.sh
#
# then commit the result. `contents: write` is gone with the PR step; this job
# only ever needs to read.

on:
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch + filter spec
        run: |
          ./scripts/fetch_openapi.sh
          python scripts/filter_openapi.py
      - name: Regenerate models
        run: |
          pip install -e "python[dev]"
          ./scripts/gen_models.sh
      - name: Run tests
        working-directory: python
        run: pytest -q
      - name: Fail if the OpenAPI spec or the generated models drifted
        run: |
          if ! git diff --exit-code; then
            echo "::error::production's OpenAPI spec no longer matches the copy committed here."
            echo "::error::Regenerate locally and commit — see this workflow's header comment."
            exit 1
          fi

      # Tests passing is not the same as the contract being unchanged. On
      # 2026-08-25 production grew three required fields (articles_indexed,
      # citation, citation_url) and the regenerated models failed 14 hand-written
      # fixtures still shaped for the old contract — the drift was real and the
      # suite caught it only because the fixtures happened to be strict. Keep the
      # diff check above even when the tests are green.

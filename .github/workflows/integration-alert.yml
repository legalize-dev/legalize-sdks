name: integration-alert

# The integration workflows run on a schedule, so a failure only ever showed up
# as a red mark nobody opens. They failed daily from 2026-08-11 to 2026-08-21
# with a dead LEGALIZE_API_KEY, and again from 2026-09-02 for two months, the
# second time with an open issue nobody read.
#
# The whole state is one issue labelled `alerta`: opened or updated on a
# failure, closed once every watched workflow is green again on main. It
# notifies nobody through GitHub on purpose; the owner's morning review reads
# the open `alerta` issues and reports them.

on:
  workflow_run:
    workflows: [python-integration, node-integration, go-integration, openapi-sync]
    types: [completed]

permissions:
  issues: write
  actions: read

jobs:
  alert:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_DATE: ${{ github.event.workflow_run.created_at }}
          WATCHED: python-integration node-integration go-integration openapi-sync
          TITLE: CI de integración del SDK en rojo
        run: |
          set -euo pipefail
          gh label create alerta --repo "$REPO" --color d73a4a \
            --description "Algo está roto; la revisión diaria lo lee" 2>/dev/null || true
          issue=$(gh issue list --repo "$REPO" --state open --label alerta \
            --search "\"$TITLE\" in:title" --limit 1 --json number --jq '.[0].number // empty')

          # The latest run of each watched workflow on main, this one included.
          red=""
          for w in $WATCHED; do
            c=$(gh run list --repo "$REPO" --workflow "$w" --branch main --limit 1 \
              --json conclusion --jq '.[0].conclusion // empty')
            if [ "$c" = "failure" ]; then red="$red $w"; fi
          done

          if [ -z "$red" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$REPO" --comment "En verde otra vez: $RUN_URL"
            fi
            exit 0
          fi

          old=""
          if [ -n "$issue" ]; then
            old=$(gh issue view "$issue" --repo "$REPO" --json body --jq .body)
          fi
          first=$(printf '%s\n' "$old" | sed -nE 's/^Primer fallo: ([0-9-]+).*/\1/p' | head -1)
          first="${first:-${RUN_DATE%%T*}}"
          if [ "$CONCLUSION" = "failure" ]; then
            last="Última ejecución fallida: \`$WORKFLOW\` $RUN_URL"
          else
            last=$(printf '%s\n' "$old" | grep '^Última ejecución fallida:' | head -1)
          fi
          body="Primer fallo: $first
          En rojo ahora:$red
          $last

          Las suites vivas llaman a https://legalize.dev con \`LEGALIZE_API_KEY\`. Un 401
          \`invalid_api_key\` es que ese secreto está muerto: rota la clave y ejecuta
          \`gh secret set LEGALIZE_API_KEY --repo $REPO\`.

          Se cierra solo cuando las cuatro ($WATCHED) vuelven a verde en main."

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --label alerta --title "$TITLE" --body "$body"
          fi

name: go-ci

# vet + gofmt + golangci-lint + matrix `go test -race` (1.23, 1.24)
# for the Go submodule at `go/` (published as
# `github.com/legalize-dev/legalize-sdks/go`).

on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - "openapi-sdk.json"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "go/**"
      - "openapi-sdk.json"
      - ".github/workflows/go-ci.yml"
  workflow_dispatch:

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: go

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: go
          version: latest
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod requires 1.23; setup-go v6 stopped auto-upgrading the
        # toolchain, so a "1.22" entry fails outright instead of silently
        # running 1.23+ as it did under v5.
        go-version: ["1.23", "1.24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/go.sum
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: matrix.go-version == '1.24'
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: go/coverage.out

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build
        run: go build ./...
      - name: Verify module consistency
        run: |
          go mod tidy -diff
          go mod verify
